name: Publish Watermelon app video to website
on:
  push:
    branches: [main]
    paths: ['.github/workflows/watermelon-site-video.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-video:
    if: github.repository == 'xroger1969/watermelon-propostas'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Retrieve supplied promotional video and verify exact bytes
        env:
          SOURCE_URL: https://at.adobe.com/u8ynQIVLPiaiEDCg
          EXPECTED_SHA256: c3bd036d0988619e30e77a580abdfc1eee76ce53e5ba07c3282e2662f506e084
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 240 \
            "$SOURCE_URL" -o public/videos/watermelon-app-adventure-en.mp4
          echo "$EXPECTED_SHA256  public/videos/watermelon-app-adventure-en.mp4" | sha256sum --check
          test "$(stat -c %s public/videos/watermelon-app-adventure-en.mp4)" -gt 1000000
      - name: Commit only verified public campaign video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos/watermelon-app-adventure-en.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish Watermelon app adventure promotional video'
            git push origin HEAD:main
          fi
