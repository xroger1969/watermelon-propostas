name: Watermelon App Store status audit
on:
  push:
    branches: [audit/watermelon-store-state-20261024]
    paths: ['.github/workflows/watermelon-store-state.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'xroger1969/watermelon-propostas' && github.ref == 'refs/heads/audit/watermelon-store-state-20261024'
    runs-on: ubuntu-latest
    environment: testflight
    timeout-minutes: 5
    steps:
      - name: Read only the Watermelon app's current Apple account data
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,tempfile,time,urllib.request,urllib.error
          def b64(value): return base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          now=int(time.time())
          msg=b64(json.dumps({'alg':'ES256','kid':os.environ['APPSTORE_API_KEY_ID'],'typ':'JWT'}).encode())+'.'+b64(json.dumps({'iss':os.environ['APPSTORE_ISSUER_ID'],'iat':now,'exp':now+900,'aud':'appstoreconnect-v1'}).encode())
          with tempfile.TemporaryDirectory() as d:
              p=pathlib.Path(d,'key.p8');p.write_text(os.environ['APPSTORE_API_PRIVATE_KEY']);p.chmod(0o600)
              der=subprocess.run(['openssl','dgst','-sha256','-sign',str(p)],input=msg.encode(),capture_output=True,check=True).stdout
          if len(der)<8 or der[0]!=48 or der[1]>=128 or der[2]!=2: raise SystemExit('Invalid signature format')
          n=der[3];r=der[4:4+n];off=4+n
          if der[off]!=2: raise SystemExit('Invalid signature integer')
          n=der[off+1];s=der[off+2:off+2+n]
          token=msg+'.'+b64(int.from_bytes(r,'big').to_bytes(32,'big')+int.from_bytes(s,'big').to_bytes(32,'big'))
          def get(path):
              if not path.startswith(('/v1/','/v2/')): raise ValueError('Unexpected endpoint')
              req=urllib.request.Request('https://api.appstoreconnect.apple.com'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
              except urllib.error.HTTPError as e: return {'error_status':e.code}
          def rows(data):
              value=data.get('data',[]);return value if isinstance(value,list) else ([value] if value else [])
          aid='6821932993';report={'app_id':aid,'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'read_only':True}
          app=get('/v1/apps/'+aid)
          report['app_fields']=[{k:x.get('attributes',{}).get(k,'NOT_RETURNED') for k in ('name','bundleId','primaryLocale','contentRightsDeclaration')} for x in rows(app)]
          report['available_app_relationships']=[list(x.get('relationships',{})) for x in rows(app)]
          result=get('/v1/builds?filter[app]='+aid+'&sort=-uploadedDate&limit=5&include=preReleaseVersion')
          pre={x['id']:x['attributes'].get('version') for x in result.get('included',[]) if x.get('type')=='preReleaseVersions'}
          report['builds']=[{'id':x['id'],'build':x['attributes'].get('version'),'version':pre.get(x.get('relationships',{}).get('preReleaseVersion',{}).get('data',{}).get('id')),'processing':x['attributes'].get('processingState'),'uploaded_at':x['attributes'].get('uploadedDate')} for x in rows(result)]
          report['beta_5103']=[x.get('attributes',{}) for x in rows(get('/v1/builds/d5f5b1ac-3ad4-4188-90df-cfcd39fafaca/betaAppReviewSubmission'))]
          report['versions']=[]
          for v in rows(get('/v1/apps/'+aid+'/appStoreVersions?filter[platform]=IOS&limit=10')):
              entry={'id':v['id'],'version':v['attributes'].get('versionString'),'state':v['attributes'].get('appStoreState'),'release_type':v['attributes'].get('releaseType')}
              entry['selected_build']=[x['attributes'].get('version') for x in rows(get('/v1/appStoreVersions/'+v['id']+'/build'))]
              entry['locales']=[]
              for loc in rows(get('/v1/appStoreVersions/'+v['id']+'/appStoreVersionLocalizations')):
                  l={'locale':loc['attributes'].get('locale'),'fields_present':{k:bool(loc['attributes'].get(k)) for k in ('description','keywords','supportUrl')},'screenshots':[]}
                  for sset in rows(get('/v1/appStoreVersionLocalizations/'+loc['id']+'/appScreenshotSets')):
                      shots=rows(get('/v1/appScreenshotSets/'+sset['id']+'/appScreenshots?limit=50'))
                      l['screenshots'].append({'display':sset['attributes'].get('screenshotDisplayType'),'states':[x['attributes'].get('assetDeliveryState',{}).get('state') for x in shots]})
                  entry['locales'].append(l)
              report['versions'].append(entry)
          report['age_rating']=[]
          for info in rows(get('/v1/apps/'+aid+'/appInfos?limit=10')):
              if info['attributes'].get('appStoreState')=='PREPARE_FOR_SUBMISSION':
                  report['age_rating']+=[{'id':x['id'],'attributes':x.get('attributes',{})} for x in rows(get('/v1/appInfos/'+info['id']+'/ageRatingDeclaration'))]
          report['prices']=[]
          for sch in rows(get('/v1/apps/'+aid+'/appPriceSchedule?include=baseTerritory')):
              price=get('/v1/appPriceSchedules/'+sch['id']+'/manualPrices?include=appPricePoint&limit=200')
              report['prices']+=[x.get('attributes',{}).get('customerPrice') for x in price.get('included',[]) if x.get('type')=='appPricePoints']
          result=json.dumps(report,indent=2);print(result)
          pathlib.Path(os.environ['RUNNER_TEMP'],'watermelon-store-state.json').write_text(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: watermelon-store-state
          path: ${{ runner.temp }}/watermelon-store-state.json
          retention-days: 2
