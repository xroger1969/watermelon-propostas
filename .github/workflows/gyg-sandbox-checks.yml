name: Watermelon Studio — GetYourGuide sandbox checks
on:
  pull_request:
    branches: [product-studio-mvp]
    paths:
      - 'product-studio/**'
      - '.github/workflows/gyg-sandbox-checks.yml'
  push:
    branches: [product-studio-mvp]
    paths:
      - 'product-studio/**'
permissions:
  contents: read
jobs:
  node-sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Run connectivity safety tests
        working-directory: product-studio
        run: npm test
