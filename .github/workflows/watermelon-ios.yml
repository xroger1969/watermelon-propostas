name: Watermelon iOS — build, tests and TestFlight
on:
  push:
    branches: [main]
    paths: ['ios/Watermelon/**', 'scripts/*watermelon*', '.github/workflows/watermelon-ios.yml']
  pull_request:
    paths: ['ios/Watermelon/**', 'scripts/*watermelon*', '.github/workflows/watermelon-ios.yml']
  workflow_dispatch:
    inputs:
      send_to_testflight:
        description: Send the tested build to Apple TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: watermelon-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  simulator:
    name: Compile and test native iPhone app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/simulators.json') as f: data=json.load(f)
          phones=[d for runtime, devices in data['devices'].items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and 'iPhone' in d['name']]
          if not phones: raise SystemExit('No iPhone simulator available')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('WATERMELON_SIMULATOR='+phones[0]['udid']+'\n')
          print(phones[0]['name'])
          PY
      - name: Run pricing, privacy-link, API and navigation tests
        run: |
          set -o pipefail
          xcodebuild test -project ios/Watermelon/Watermelon.xcodeproj -scheme Watermelon \
            -configuration Debug -destination "platform=iOS Simulator,id=$WATERMELON_SIMULATOR" \
            -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/WatermelonDerived" \
            -resultBundlePath "$RUNNER_TEMP/WatermelonTests.xcresult" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/watermelon-test.log" 2>&1 || { tail -n 180 "$RUNNER_TEMP/watermelon-test.log"; exit 1; }
          tail -n 60 "$RUNNER_TEMP/watermelon-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watermelon-ios-test-results
          path: |
            ${{ runner.temp }}/WatermelonTests.xcresult
            ${{ runner.temp }}/watermelon-test.log
          retention-days: 7
  signing-status:
    name: Check Apple configuration without exposing credentials
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Report signing readiness
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          WATERMELON_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATERMELON_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          names=['APPLE_TEAM_ID','APPSTORE_ISSUER_ID','APPSTORE_API_KEY_ID','APPSTORE_API_PRIVATE_KEY','APPLE_DISTRIBUTION_CERTIFICATE_BASE64','APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD','WATERMELON_PROVISIONING_PROFILE_BASE64']
          missing=[n for n in names if not os.environ.get(n)]
          summary='Apple configuration missing: '+', '.join(missing) if missing else 'Apple signing credentials present. App record and matching profile must still be verified.'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(summary+'\n')
          PY
  testflight:
    name: Sign and upload Watermelon to TestFlight
    needs: simulator
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.send_to_testflight) || (github.event_name == 'push' && (vars.WATERMELON_TESTFLIGHT_ENABLED == 'true' || contains(github.event.head_commit.message, '[watermelon-testflight]'))))
    runs-on: macos-26
    timeout-minutes: 50
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - name: Archive and export the Watermelon app
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          WATERMELON_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATERMELON_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/watermelon-sign-export.sh
      - name: Upload to Apple TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/watermelon-export/Watermelon.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'
      - name: Clean private signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/watermelon-signing.keychain-db" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/watermelon-profile.plist" ]]; then
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/watermelon-profile.plist" 2>/dev/null || true)
            if [[ -n "$profile_uuid" ]]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"; fi
          fi
          rm -f "$RUNNER_TEMP/watermelon-cert.p12" "$RUNNER_TEMP/watermelon-profile.mobileprovision" "$RUNNER_TEMP/watermelon-profile.plist" "$RUNNER_TEMP/watermelon-export.plist"
