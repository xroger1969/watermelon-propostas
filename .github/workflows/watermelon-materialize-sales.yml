name: Materialize reviewed Watermelon sales changes
on:
  push:
    branches: [release/watermelon-ios-appstore-1-0-free-20261024]
    paths: ['.github/workflows/watermelon-materialize-sales.yml']
permissions:
  contents: write
  actions: write
jobs:
  validate-patch:
    if: github.repository == 'xroger1969/watermelon-propostas' && github.ref == 'refs/heads/release/watermelon-ios-appstore-1-0-free-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/watermelon-ios-appstore-1-0-free-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exactly the reviewed patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          path=pathlib.Path('scripts/watermelon-sales-changes.patch.gz.b64')
          patch=gzip.decompress(base64.b64decode(path.read_text(),validate=False))
          expected='b9bf4d4cec07a52ff6fcd1eaa399bf1e206c288a30b9fd1902ecc0019b811d7f'
          if hashlib.sha256(patch).hexdigest()!=expected:
              raise SystemExit('Patch checksum mismatch; nothing applied')
          allowed=('app/api/booking-request/route.ts','app/api/booking-status/route.ts','database/customer-booking-status.sql','docs/watermelon-app-store-public-release.md','ios/Watermelon/','tests/booking-status.cjs')
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  name=line[6:]
                  if '..' in name.split('/') or not any(name==item or (item.endswith('/') and name.startswith(item)) for item in allowed):
                      raise SystemExit('Unexpected patch target: '+name)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          print('Reviewed patch applied; no Apple or payment credentials were used.')
          PY
      - name: Install pinned project dependencies for validation
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run complete server regression suite and TypeScript
        run: |
          npm test
          npm run typecheck
      - name: Commit verified source only to the existing release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/booking-request/route.ts app/api/booking-status/route.ts database/customer-booking-status.sql docs/watermelon-app-store-public-release.md ios/Watermelon tests/booking-status.cjs
          git rm scripts/watermelon-sales-changes.patch.gz.b64
          git commit -m 'feat(sales): track guest reservations and gate payment on Watermelon approval'
          git push origin HEAD:release/watermelon-ios-appstore-1-0-free-20261024
      - name: Start full native iOS validation without uploading or submitting
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watermelon-ios.yml --ref release/watermelon-ios-appstore-1-0-free-20261024 -f send_to_testflight=false
