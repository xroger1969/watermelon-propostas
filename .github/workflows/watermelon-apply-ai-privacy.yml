name: Apply Watermelon AI privacy correction
on:
  push:
    branches: [fix/ios-ai-privacy-consent-20261024]
    paths: ['.github/workflows/watermelon-apply-ai-privacy.yml']
permissions:
  contents: write
jobs:
  apply-privacy:
    if: github.repository == 'xroger1969/watermelon-propostas' && github.ref == 'refs/heads/fix/ios-ai-privacy-consent-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-ai-privacy-consent-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked consent source changes
        run: |
          python3 -m py_compile scripts/watermelon-apply-ai-privacy.py
          python3 scripts/watermelon-apply-ai-privacy.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/Watermelon/Watermelon/AppStore.swift')
          text=p.read_text()
          text=text.replace('Label(consent.hasPermission ? "AI sharing is enabled." : "AI sharing is disabled.", systemImage: "hand.raised")', 'Label(LocalizedStringKey(consent.hasPermission ? "AI sharing is enabled." : "AI sharing is disabled."), systemImage: "hand.raised")')
          p.write_text(text)
          PY
          git diff --check
      - name: Validate server regressions and TypeScript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
      - name: Commit only consent and privacy files on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Watermelon/Watermelon/AppStore.swift ios/Watermelon/Watermelon/APIClient.swift ios/Watermelon/Watermelon/WatermelonApp.swift ios/Watermelon/Watermelon/TripViews.swift ios/Watermelon/Watermelon/PrivacyInfo.xcprivacy ios/Watermelon/Watermelon/*.lproj/Localizable.strings ios/Watermelon/WatermelonTests/WatermelonTests.swift ios/Watermelon/WatermelonUITests/WatermelonUITests.swift app/privacy/page.tsx
          git rm scripts/watermelon-apply-ai-privacy.py .github/workflows/watermelon-apply-ai-privacy.yml
          git commit -m 'fix(privacy): require and allow revoking explicit consent before any native AI request'
          git push origin HEAD:fix/ios-ai-privacy-consent-20261024
      - name: Export only tracked source for independent verification
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/watermelon-privacy-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: watermelon-privacy-source
          path: ${{ runner.temp }}/watermelon-privacy-source.zip
          retention-days: 2
