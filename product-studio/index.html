<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Watermelon Product Studio</title>
<meta name="description" content="Backoffice independente para criação e gestão de experiências Watermelon." />
<style>
:root{--pink:#ef1f4f;--green:#48bf4b;--ink:#172027;--muted:#66727b;--bg:#f4f7f5;--card:#fff;--line:#e2e8e4;--soft:#f9fbfa;--warn:#fff5dc;--warn-ink:#7d5900;--danger:#b42318;--shadow:0 12px 32px rgba(18,38,28,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{background:#111b17;color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.wm{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--pink) 0 56%,#111 57% 62%,var(--green) 63% 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}.brand b{font-size:17px;line-height:1.05}.brand span{display:block;color:#a8b7af;font-size:12px;margin-top:3px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#d6e0db;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:#1f3028;color:#fff}.nav small{display:block;color:#7f9188;margin:22px 12px 8px;text-transform:uppercase;letter-spacing:.09em;font-size:10px}.side-note{position:absolute;left:18px;right:18px;bottom:18px;background:#192821;border:1px solid #2c4137;border-radius:12px;padding:12px;font-size:12px;color:#afbeb7}.main{padding:28px 32px 60px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.topbar h1{font-size:28px;margin:0}.topbar p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650;cursor:pointer}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.07)}.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#0e2812}.btn.ghost{background:transparent}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:18px}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:30px;font-weight:800;margin-top:7px}.metric .sub{font-size:12px;color:#829087;margin-top:2px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:12px}.section-head h2{margin:0;font-size:19px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.card{padding:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf1ee;font-size:13px;vertical-align:middle}.table th{color:#64736b;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef4f0}.badge.live{background:#e4f7e6;color:#20752b}.badge.draft{background:#f2f2f2;color:#555}.badge.ready{background:#e7f3ff;color:#1a5c91}.badge.paused{background:#fff0d7;color:#8b5b00}.badge.archived{background:#fde9e7;color:#8d2a22}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.row-actions{display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 9px;cursor:pointer}.empty{padding:38px;text-align:center;color:var(--muted)}.hidden{display:none!important}.wizard{display:grid;grid-template-columns:240px 1fr;gap:18px}.steps{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;height:max-content;position:sticky;top:20px}.step{padding:11px 12px;border-radius:10px;color:#66736d;font-size:13px;cursor:pointer}.step.active{background:#eef8ef;color:#174a20;font-weight:800}.step.done:before{content:'✓ ';color:var(--green);font-weight:900}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.panel h3{margin:0 0 5px;font-size:20px}.panel>p{margin:0 0 20px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#415047}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #dce4df;border-radius:10px;background:#fff;outline:none}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#7fca84;box-shadow:0 0 0 3px rgba(72,191,75,.12)}.hint{font-size:11px;color:#849088}.wizard-footer{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}.quality{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;background:#f7faf8;border:1px solid var(--line);padding:16px;border-radius:14px}.score{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:27px;background:conic-gradient(var(--green) calc(var(--score)*1%),#e5ebe7 0);position:relative}.score:after{content:'';position:absolute;inset:8px;background:white;border-radius:50%}.score span{z-index:1}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 16px;font-size:12px}.check.ok{color:#256b2d}.check.no{color:#8a4a3a}.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0 22px}.start-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer}.start-card:hover{border-color:#9ccfa0;box-shadow:0 8px 20px rgba(0,0,0,.06)}.start-card b{display:block;margin-bottom:5px}.start-card span{font-size:12px;color:var(--muted)}.start-card.ai-main{border:2px solid #9adf9c;background:linear-gradient(145deg,#f3fff3,#fff6f8)}.market-panel{margin-top:16px;border:1px solid #dce7df;background:#f8fbf9;border-radius:14px;padding:14px}.market-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.market-grid div{background:white;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px}.comp-list{display:grid;gap:7px;margin-top:10px}.comp{font-size:12px;padding:9px;border:1px solid var(--line);border-radius:9px;background:white}.comp a{color:#225f38;text-decoration:none;font-weight:700}.upload-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.notice{background:var(--warn);color:var(--warn-ink);border:1px solid #f3d894;padding:12px 14px;border-radius:12px;font-size:12px}.source-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.source{border:1px solid var(--line);border-radius:12px;padding:14px}.source b{display:block;font-size:13px}.source span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.source strong{display:block;margin-top:10px;font-size:12px}.preview-card{max-width:640px;margin:auto;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:white;box-shadow:var(--shadow)}.preview-img{height:220px;background:linear-gradient(135deg,#e9f6e9,#ffe5eb);display:grid;place-items:center;color:#6d8073;font-weight:700}.preview-body{padding:20px}.preview-body h2{font-size:24px;margin:0 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{background:#f2f6f3;border:1px solid #e0e6e2;border-radius:999px;padding:6px 9px;font-size:11px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.search{max-width:360px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px}.modal{position:fixed;inset:0;background:rgba(7,15,11,.62);display:grid;place-items:center;padding:20px;z-index:20}.modal .box{background:white;max-width:560px;width:100%;border-radius:18px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.3)}.modal h3{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.kpi-line{display:flex;gap:8px;align-items:center;font-size:12px}.progress{height:8px;background:#e7ece9;border-radius:999px;overflow:hidden;flex:1}.progress>i{display:block;height:100%;background:var(--green)}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.side-note{position:static;margin-top:20px}.nav{grid-template-columns:repeat(3,1fr)}.nav small{grid-column:1/-1;margin:10px}.grid4{grid-template-columns:repeat(2,1fr)}.wizard{grid-template-columns:1fr}.steps{position:static;display:flex;overflow:auto}.step{white-space:nowrap}.start-grid,.source-box{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.main{padding:20px 14px 45px}.topbar{align-items:flex-start;flex-direction:column}.grid4,.form-grid,.start-grid,.source-box,.checks{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.wizard-footer{flex-direction:column}.quality{grid-template-columns:1fr}.score{margin:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="wm"></div><div><b>Watermelon<br>Product Studio</b><span>Standalone catalogue manager</span></div></div>
  <div class="nav">
    <button data-view="dashboard" class="active">◫ Dashboard</button>
    <button data-view="products">▦ Produtos</button>
    <button data-view="new">＋ Novo produto</button>
    <small>Canais</small>
    <button data-view="sync">⇄ Viator Sync</button>
    <button data-view="settings">⚙ Definições</button>
  </div>
  <div class="side-note"><b>Ambiente isolado</b><br>Este Studio não publica nem altera o site Watermelon atual.</div>
</aside>
<main class="main">
  <section id="dashboardView"></section>
  <section id="productsView" class="hidden"></section>
  <section id="newView" class="hidden"></section>
  <section id="syncView" class="hidden"></section>
  <section id="settingsView" class="hidden"></section>
</main>
</div>
<div id="modal" class="hidden"></div>
<script>
const STORAGE='watermelon_product_studio_v1';
const emptyProduct=()=>({id:'WM-'+Date.now(),status:'Draft',source:'WATERMELON',title:'',shortTitle:'',destination:'',category:'Private Tour',duration:'',summary:'',description:'',highlights:'',itinerary:'',meetingPoint:'',pickup:'Hotel pickup available',dropoff:'',included:'',excluded:'',language:'English',groupType:'Private',maxGuests:'8',optionTitle:'Standard',optionCode:'OPT-1',priceType:'Per group',adultPrice:'',childPrice:'',currency:'EUR',days:'Mon,Tue,Wed,Thu,Fri,Sat,Sun',startTimes:'09:00',capacity:'8',cutoffHours:'12',cancellation:'Free cancellation up to 24 hours before start time',questions:'Hotel / accommodation name',mainImage:'',viatorCode:'',pricingProvider:'WATERMELON',availabilityProvider:'WATERMELON',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
let products=[];let current=null;let currentStep=0;let editingId=null;
const steps=['Começar','Informação','Conteúdo','Logística','Opções & preço','Disponibilidade','Revisão'];
function load(){try{products=JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(e){products=[]}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(products))}
function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function statusBadge(s){return `<span class="badge ${s.toLowerCase()}"><i class="dot"></i>${s}</span>`}
function quality(p){let items=[p.title,p.destination,p.duration,p.summary,p.description,p.itinerary,p.meetingPoint||p.pickup,p.included,p.excluded,p.optionTitle,p.adultPrice,p.days,p.startTimes,p.cancellation];let ok=items.filter(Boolean).length;return Math.round(ok/items.length*100)}
function renderDashboard(){const live=products.filter(p=>p.status==='Live').length,draft=products.filter(p=>p.status==='Draft').length,ready=products.filter(p=>p.status==='Ready').length,linked=products.filter(p=>p.viatorCode).length;document.querySelector('#dashboardView').innerHTML=`
<div class="topbar"><div><h1>Product Studio</h1><p>O catálogo Watermelon começa aqui — independente da Viator.</p></div><div class="actions"><button class="btn" onclick="exportAll()">Exportar JSON</button><button class="btn primary" onclick="go('new')">＋ Criar produto</button></div></div>
<div class="grid4"><div class="metric"><div class="label">Produtos</div><div class="value">${products.length}</div><div class="sub">catálogo interno</div></div><div class="metric"><div class="label">Ready / Live</div><div class="value">${ready+live}</div><div class="sub">prontos ou ativos</div></div><div class="metric"><div class="label">Rascunhos</div><div class="value">${draft}</div><div class="sub">a completar</div></div><div class="metric"><div class="label">Ligados à Viator</div><div class="value">${linked}</div><div class="sub">mapeamentos externos</div></div></div>
<div class="section"><div class="section-head"><div><h2>Fluxo de independência</h2><p>Separação entre conteúdo Watermelon e canais externos.</p></div></div><div class="card"><div class="source-box"><div class="source"><b>Watermelon Product Studio</b><span>Fonte mestre de conteúdo e estrutura</span><strong>OWNED</strong></div><div class="source"><b>Pricing / Availability</b><span>Pode vir da Watermelon ou Viator por produto</span><strong>SWITCHABLE</strong></div><div class="source"><b>Website / Viator / outros</b><span>Canais de distribuição</span><strong>CHANNELS</strong></div></div></div></div>
<div class="section"><div class="section-head"><div><h2>Produtos recentes</h2><p>O histórico permanece mesmo quando um produto é arquivado.</p></div><button class="btn" onclick="go('products')">Ver todos</button></div>${productTable(products.slice(0,6))}</div>`}
function productTable(list){if(!list.length)return `<div class="card empty">Ainda não existem produtos neste Studio. Cria o primeiro sem afetar o site atual.</div>`;return `<div class="card table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Destino</th><th>Estado</th><th>Origem</th><th>Viator</th><th>Qualidade</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.title||'Sem título')}</b><br><span class="hint">${esc(p.id)}</span></td><td>${esc(p.destination||'—')}</td><td>${statusBadge(p.status)}</td><td>${p.source==='VIATOR'?'Viator importado':'Watermelon'}</td><td>${p.viatorCode?esc(p.viatorCode):'—'}</td><td><div class="kpi-line"><span>${quality(p)}%</span><span class="progress"><i style="width:${quality(p)}%"></i></span></div></td><td><div class="row-actions"><button class="iconbtn" onclick="editProduct('${p.id}')">Editar</button><button class="iconbtn" onclick="duplicateProduct('${p.id}')">Duplicar</button></div></td></tr>`).join('')}</tbody></table></div>`}
function renderProducts(){document.querySelector('#productsView').innerHTML=`<div class="topbar"><div><h1>Produtos</h1><p>Um identificador Watermelon é sempre a identidade principal.</p></div><div class="actions"><button class="btn primary" onclick="go('new')">＋ Novo produto</button></div></div><div class="toolbar"><input id="q" class="search" placeholder="Pesquisar por título, destino ou código…" oninput="filterProducts()"><select id="statusFilter" class="search" style="max-width:180px" onchange="filterProducts()"><option value="">Todos os estados</option><option>Draft</option><option>Ready</option><option>Live</option><option>Paused</option><option>Archived</option></select></div><div id="productTableArea">${productTable(products)}</div>`}
function filterProducts(){let q=(document.querySelector('#q').value||'').toLowerCase(),s=document.querySelector('#statusFilter').value;let f=products.filter(p=>(!s||p.status===s)&&(!q||[p.title,p.destination,p.id,p.viatorCode].join(' ').toLowerCase().includes(q)));document.querySelector('#productTableArea').innerHTML=productTable(f)}
function go(v){document.querySelectorAll('.main>section').forEach(x=>x.classList.add('hidden'));document.querySelector('#'+v+'View').classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='dashboard')renderDashboard();if(v==='products')renderProducts();if(v==='new'){if(!current)startNew();else renderWizard()}if(v==='sync')renderSync();if(v==='settings')renderSettings()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
function startNew(mode='manual'){current=emptyProduct();editingId=null;currentStep=0;if(mode==='viator')current.source='VIATOR';renderWizard()}
function editProduct(id){current=JSON.parse(JSON.stringify(products.find(p=>p.id===id)));editingId=id;currentStep=1;go('new')}
function duplicateProduct(id){let p=products.find(p=>p.id===id);if(!p)return;current={...JSON.parse(JSON.stringify(p)),id:'WM-'+Date.now(),title:(p.title||'Produto')+' — Copy',status:'Draft',viatorCode:'',source:'WATERMELON',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};editingId=null;currentStep=1;go('new')}
function renderWizard(){document.querySelector('#newView').innerHTML=`<div class="topbar"><div><h1>${editingId?'Editar produto':'Novo produto'}</h1><p>${editingId?esc(current.id):'Criação estruturada ao estilo Viator, mas com a Watermelon como master.'}</p></div><div class="actions"><button class="btn" onclick="saveDraft()">Guardar rascunho</button></div></div><div class="wizard"><div class="steps">${steps.map((s,i)=>`<div class="step ${i===currentStep?'active':''} ${i<currentStep?'done':''}" onclick="jump(${i})">${i+1}. ${s}</div>`).join('')}</div><div class="panel" id="stepPanel"></div></div>`;renderStep()}
function jump(i){syncForm();currentStep=i;renderWizard()}
function renderStep(){let el=document.querySelector('#stepPanel');if(currentStep===0){el.innerHTML=`<h3>Criar novo programa</h3><p>A IA pode começar praticamente por qualquer material que já tenhas.</p><div class="start-grid">
<div class="start-card ai-main" onclick="chooseStart('ai')"><b>✦ Texto / ideia</b><span>Descreve a experiência e a IA cria o programa completo.</span></div>
<div class="start-card ai-main" onclick="chooseStart('voice')"><b>🎙 Voz</b><span>Explica a ideia a falar; a IA transcreve e constrói o produto.</span></div>
<div class="start-card ai-main" onclick="chooseStart('image')"><b>📷 Fotografia</b><span>Envia uma foto, folheto ou captura e a IA interpreta os dados.</span></div>
<div class="start-card ai-main" onclick="chooseStart('file')"><b>📄 PDF / programa</b><span>Importa PDF, Word, apresentação ou texto de outro programa.</span></div>
<div class="start-card ai-main" onclick="chooseStart('url')"><b>🔗 Link de experiência</b><span>Cola um link e a IA cria um produto Watermelon original.</span></div>
<div class="start-card ai-main" onclick="chooseStart('viator')"><b>⇩ Importar Viator</b><span>Cola o link ou referência Viator e transforma-o num produto Watermelon.</span></div>
<div class="start-card" onclick="chooseStart('duplicate')"><b>⧉ Duplicar</b><span>Parte de um produto Watermelon já existente.</span></div>
<div class="start-card" onclick="chooseStart('manual')"><b>✍ Manual</b><span>Preenche tudo manualmente, sem IA.</span></div>
</div><div class="notice"><b>Preço inteligente:</b> após criar o rascunho, a IA pesquisa comparáveis atuais, com prioridade a Viator e outros operadores, e mostra fontes, faixa de mercado e confiança. Nada é publicado automaticamente.</div>${footer(false,true)}`}
if(currentStep===1)el.innerHTML=`<h3>Informação principal</h3><p>Identidade comercial da experiência.</p><div class="form-grid">${field('title','Título público',current.title,'full')}${field('shortTitle','Título curto',current.shortTitle)}${field('destination','Destino',current.destination)}${select('category','Categoria',current.category,['Private Tour','Day Trip','Walking Tour','Food & Drink','Boat Tour','Transfer','Attraction','Custom Experience'])}${field('duration','Duração',current.duration,'','Ex.: 8 hours')}${select('groupType','Tipo de grupo',current.groupType,['Private','Shared','Private / Shared options'])}${field('maxGuests','Máximo de participantes',current.maxGuests)}${field('viatorCode','Código Viator (opcional)',current.viatorCode,'','Nunca substitui o ID Watermelon')}${select('source','Origem inicial',current.source,['WATERMELON','VIATOR'])}</div>${footer()}`
if(currentStep===2)el.innerHTML=`<h3>Conteúdo comercial</h3><p>Texto que poderá alimentar o site e outros canais.</p><div class="form-grid">${textarea('summary','Resumo curto',current.summary,'full')}${textarea('description','Descrição completa',current.description,'full')}${textarea('highlights','Highlights — um por linha',current.highlights)}${textarea('itinerary','Itinerário — uma etapa por linha',current.itinerary)}${textarea('included','Incluído — um por linha',current.included)}${textarea('excluded','Não incluído — um por linha',current.excluded)}</div>${footer()}`
if(currentStep===3)el.innerHTML=`<h3>Logística</h3><p>Pontos de encontro, recolhas e requisitos operacionais.</p><div class="form-grid">${field('meetingPoint','Meeting point',current.meetingPoint,'full')}${field('pickup','Pickup',current.pickup)}${field('dropoff','Drop-off',current.dropoff)}${select('language','Idioma principal',current.language,['English','Portuguese','Spanish','French','Multilingual'])}${textarea('questions','Perguntas ao cliente',current.questions,'full')}</div>${footer()}`
if(currentStep===4)el.innerHTML=`<h3>Opção & preço</h3><p>Cada produto pode depois ter várias opções independentes.</p><div class="form-grid">${field('optionTitle','Nome da opção',current.optionTitle)}${field('optionCode','Código interno da opção',current.optionCode)}${select('priceType','Tipo de preço',current.priceType,['Per person','Per group','Per vehicle','Fixed'])}${select('currency','Moeda',current.currency,['EUR','USD','GBP'])}${field('adultPrice','Preço principal',current.adultPrice,'','Preço de venda Watermelon')}${field('childPrice','Preço criança / secundário',current.childPrice)}${select('pricingProvider','Fornecedor de preço',current.pricingProvider,['WATERMELON','VIATOR'])}<div class="field"><label>Regra</label><div class="notice">Preço do Studio e preço Viator ficam separados. Mais tarde escolhemos qual alimenta cada canal.</div></div></div>${footer()}`

let voiceRecorder=null,voiceChunks=[],voiceStream=null,voiceTimer=null;
async function openVoiceBrief(){
  try{
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
    voiceChunks=[];
    voiceRecorder=new MediaRecorder(voiceStream);
    voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};
    voiceRecorder.onstop=finishVoiceBrief;
    voiceRecorder.start();
    let sec=0;
    showModal(`<h3>🎙 A ouvir o teu briefing</h3><p>Explica a experiência naturalmente: destino, duração, percurso, o que inclui, nº de pessoas e o posicionamento que pretendes.</p><div class="notice"><b id="voiceClock">00:00</b> · gravação em curso</div><p class="hint">A gravação termina automaticamente aos 90 segundos.</p>`,
      [{label:'Parar e criar programa',action:'stopVoiceBrief()'}]
    );
    voiceTimer=setInterval(()=>{sec++;const m=document.querySelector('#voiceClock');if(m)m.textContent=`00:${String(sec).padStart(2,'0')}`;if(sec>=90)stopVoiceBrief()},1000);
  }catch(e){
    showModal(`<h3>Microfone indisponível</h3><p>${esc(e.message||String(e))}</p>`,[{label:'Fechar',action:'closeModal()'}]);
  }
}
function stopVoiceBrief(){
  if(voiceTimer){clearInterval(voiceTimer);voiceTimer=null}
  if(voiceRecorder&&voiceRecorder.state!=='inactive')voiceRecorder.stop();
  voiceStream?.getTracks?.().forEach(t=>t.stop());
}
async function finishVoiceBrief(){
  try{
    const blob=new Blob(voiceChunks,{type:voiceRecorder?.mimeType||'audio/webm'});
    const dataUrl=await blobToDataURL(blob);
    const modal=document.querySelector('#modal');
    modal.innerHTML=`<div class="box"><h3>🎙 A transcrever…</h3><p>Primeiro transformo a tua voz em briefing e depois crio o programa.</p></div>`;
    const tr=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataUrl,fileName:'watermelon-brief.webm'})});
    const td=await tr.json();
    if(!tr.ok)throw new Error(td.error||'Falha na transcrição');
    await runIntake({mode:'text',brief:td.text},'Voz: '+td.text);
  }catch(e){showIntakeError(e,()=>openVoiceBrief())}
}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function imageToDataURL(file){
  if(!file.type.startsWith('image/'))return blobToDataURL(file);
  const img=new Image(),url=URL.createObjectURL(file);
  try{
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
    const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.84);
  }finally{URL.revokeObjectURL(url)}
}
async function uploadPrivateFile(file){
  const ticketRes=await fetch('/api/upload-ticket',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      fileName:file.name,
      mimeType:file.type||'application/octet-stream',
      size:file.size
    })
  });
  const ticket=await ticketRes.json();
  if(!ticketRes.ok)throw new Error(ticket.error||'Não foi possível preparar o upload');

  const form=new FormData();
  form.append('cacheControl','3600');
  form.append('',file,file.name);
  const upload=await fetch(ticket.signedUrl,{
    method:'PUT',
    headers:{'x-upsert':'false'},
    body:form
  });
  if(!upload.ok){
    let msg='Falha no upload privado';
    try{const data=await upload.json();msg=data?.message||data?.error||msg}catch{}
    throw new Error(msg);
  }
  return ticket;
}
async function runFileIntake(mode){
  const file=document.querySelector('#sourceFile')?.files?.[0];
  const note=(document.querySelector('#fileNote')?.value||'').trim();
  if(!file){toast('Escolhe um ficheiro');return}
  if(mode==='file'&&file.size>48*1024*1024){toast('O ficheiro deve ter no máximo 48 MB');return}
  try{
    const modal=document.querySelector('#modal');
    if(mode==='image'){
      modal.innerHTML=`<div class="box"><h3>✦ A analisar a imagem…</h3><p>A IA está a interpretar a fotografia e a criar o programa.</p></div>`;
      const dataUrl=await imageToDataURL(file);
      await runIntake({mode:'image',dataUrl,fileName:file.name,mimeType:file.type,brief:note},`Fotografia: ${file.name}`);
      return;
    }

    modal.innerHTML=`<div class="box"><h3>☁️ A enviar para a cloud privada…</h3><p>O ficheiro vai diretamente para a área privada do Product Studio.</p><div class="notice">Depois do upload, a IA analisa o documento sem o tornar público.</div></div>`;
    const ticket=await uploadPrivateFile(file);
    modal.innerHTML=`<div class="box"><h3>✦ A analisar o documento…</h3><p>Upload concluído. A IA está a extrair factos, criar copy Watermelon original e pesquisar o preço de mercado.</p></div>`;
    await runIntake({
      mode:'storage_file',
      storagePath:ticket.path,
      fileName:file.name,
      mimeType:file.type||'application/octet-stream',
      brief:note
    },`Ficheiro cloud: ${file.name}`);
  }catch(e){showIntakeError(e,()=>openFileBrief(mode))}
}

function resetDemo(){showModal('<h3>Limpar dados locais?</h3><p>Isto remove apenas os produtos gravados neste browser neste protótipo.</p>',[{label:'Cancelar',action:'closeModal()'},{label:'Limpar',action:'products=[];save();closeModal();renderSettings()'}])}
function showModal(html,actions=[]){let m=document.querySelector('#modal');m.className='modal';m.innerHTML=`<div class="box">${html}<div class="modal-actions">${actions.map(a=>`<button class="btn ${a.label==='Limpar'?'primary':''}" onclick="${a.action}">${a.label}</button>`).join('')}</div></div>`}function closeModal(){document.querySelector('#modal').className='hidden'}
function toast(msg){let d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',right:'20px',bottom:'20px',background:'#13231b',color:'#fff',padding:'12px 16px',borderRadius:'10px',zIndex:50,boxShadow:'0 10px 30px rgba(0,0,0,.2)'});document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function check(label,val){return `<div class="check ${val?'ok':'no'}">${val?'✓':'○'} ${label}</div>`}
async function loadCloud(){
  try{
    const r=await fetch('/api/products');
    if(!r.ok)return;
    const data=await r.json();
    if(Array.isArray(data.products)){
      products=data.products;
      save();
      renderDashboard();
      renderProducts();
    }
  }catch(e){console.warn('Cloud catalogue unavailable',e)}
}
load();renderDashboard();renderProducts();loadCloud();
</script>
